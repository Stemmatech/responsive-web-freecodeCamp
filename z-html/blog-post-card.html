<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
    <link rel="stylesheet" href="styles.css"/>


<style>
    body{
  background: #ddd;
  font-family: Arial, sans-serif;
}

.blog-post-card{
  background: #fff;
  border-radius: 10px;
  width: 350px;
  text-align: center;
  margin: auto;
}

.post-img{
  border-radius: 10px 10px 0px 0px;
  max-width: 100%;
  border-bottom: 2px solid yellow
}

.post-content{
  padding: 10px
}

.post-title, .post-excerpt{
  margin: 10px;
  font-family: Arial, sans-serif;
  color: brown;
}

.read-more{
  background-color: yellow;
  padding: 10px;
  margin:10px;
  border-radius: 10px;
  display: inline-block;
  text-decoration: none;
  
}

.read-more:hover{
  background-color: rgb(247, 247, 0);


}
</style>

</head>
<body>
    <div class="blog-post-card" >
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" class="post-img" alt="Blog post"  />


    <div class="post-content">
        <h2 class="post-title" >My First Blog</h2>
        <p class="post-excerpt" >Blog description goes here</p>

    <a class="read-more" href="" >Read More</a>


    </div>

    </div>



</body>
</html>
