<!DOCTYPE html>

<style>

}

.business-card {

  margin: 100px;

  font-size: 16px;
  margin-left: auto;
  margin-right: auto;
}

.profile-image{
  max-width: 100%;

}

p{
  margin-top: 5px;
  margin-bottom: 5px;

}

a{
  text-decoration: none;
}
</style>


</head>

    <p class="designation">stemmatech@gmail.com</p>
    <p class="company">09081859813</p>

  <div class="social-media">

    <a class="portfolio-link" href="stemmatech.com">Twitter</a>
