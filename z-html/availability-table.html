<!DOCTYPE html>

<html lang="en">



<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Availability Table</title>



    <link rel="stylesheet" href="styles.css"/>


    
    <style>
        :root {
  --color0: #ffffff;
  --color1: #d4edda;
  --color2: #c3e6cb;
  --color3: #a3e0b4;
  --color4: #5cd685;
  --color5: #28a745;
  --solid-border: 2px solid #000000;
  --dashed-border: 2px dashed #000000;
}

main{
    width: 100%;
    height: 100%;
    padding: 5rem 0;
}
table{
        width: 100%;
    height: 100%;
}
.available-0 {
  background-color: var(--color0);
}

.available-1 {
  background-color: var(--color1);
}

.available-2 {
  background-color: var(--color2);
}

.available-3 {
  background-color: var(--color3);
}

.available-4 {
  background-color: var(--color4);
}

.available-5 {
  background-color: var(--color5);
}

.sharp td {
  border-bottom: var(--solid-border);
}

.half td {
  border-bottom: var(--dashed-border);
}

#legend{
    margin-top: 3rem;
}
#legend span{
    display: block;
    margin-bottom: 0.5rem;
}


#legend-gradient {
    width: 40vw;
    height: 3vh;
    border: 1px solid var(--color4);
    border-radius: 0.3rem;
  background-image: linear-gradient(
    to right,
    var(--color0) 0%,
    var(--color0) 17%,
    var(--color1) 17%,
    var(--color1) 33%,
    var(--color2) 33%,
    var(--color2) 50%,
    var(--color3) 50%,
    var(--color3) 67%,
    var(--color4) 67%,
    var(--color4) 83%,
    var(--color5) 83%,
    var(--color5) 100%
  );
}
    </style>

</head>



<body>



    <main>



        <table>

            <caption>Weekly Meeting Availability Schedule</caption>



            <thead>

                <tr>

                    <th scope="col">Time</th>

                    <th scope="col">Monday</th>

                    <th scope="col">Tuesday</th>

                    <th scope="col">Wednesday</th>

                    <th scope="col">Thursday</th>

                    <th scope="col">Friday</th>

                </tr>

            </thead>



                <tbody>

                    <tr class="sharp">

                        <th scope="row" class="time">9:00 AM</th>

                        <td class="available-0" aria-label="0 available"> </td>

                        <td class="available-1" aria-label="1 available"> </td>

                        <td class="available-2" aria-label="2 available"> </td>

                        <td class="available-3" aria-label="3 available"> </td>

                        <td class="available-4" aria-label="4 available"> </td>

                        <td class="available-5" aria-label="5+ available"> </td>

                    </tr>



                    <tr class="half">

                        <th scope="row" class="time">10:00 AM</th>

                        <td class="available-5" aria-label="5+ available"> </td>

                        <td class="available-4" aria-label="4 available"> </td>

                        <td class="available-3" aria-label="3 available"> </td>

                        <td class="available-2" aria-label="2 available"> </td>

                        <td class="available-1" aria-label="1 available"> </td>

                        <td class="available-0" aria-label="0 available"> </td>

                    </tr>



                    <tr class="sharp">

                        <th scope="row" class="time">11:00 AM</th>

                        <td class="available-1" aria-label="1 available"> </td>

                        <td class="available-3" aria-label="3 available"> </td>

                        <td class="available-5" aria-label="5+ available"> </td>

                        <td class="available-0" aria-label="0 available"> </td>

                        <td class="available-4" aria-label="4 available"> </td>

                    </tr>



                    <tr class="half">

                        <th scope="row" class="time">12:00 PM</th>

                        <td class="available-4" aria-label="4 available"> </td>

                        <td class="available-1" aria-label="1 available"> </td>

                        <td class="available-2" aria-label="2 available"> </td>

                        <td class="available-5" aria-label="5+ available"> </td>

                        <td class="available-0" aria-label="0 available"> </td>

                    </tr>



                </tbody>



    <tfoot>

    <div id="legend">

        <span>

            Availability

        </span>

        <div id="legend-gradient">

    </div>



    </div>

    </tfoot>



        </table>

   

    </main>



</body>



</html>
